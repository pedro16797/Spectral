name: Multi-Platform CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FLUTTER_VERSION: '3.41.2' # Reverted to version from original working workflow
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter Test
        run: flutter test

  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        # Fails on analyzer warnings/errors (unused imports, dead code, type
        # issues); style-lint infos and SDK deprecations do not block CI.
        run: flutter analyze --no-fatal-infos

  build-android:
    name: Build Android APK
    needs: [test, analyze]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Strip sample files for production build
        # Belt-and-braces: the samples are not in pubspec assets, but removing
        # them guarantees a future pubspec change cannot bloat release builds.
        run: rm -rf resources/samples/

      - name: Build APK (Release)
        run: bash scripts/build.sh android

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v6
        with:
          name: android-apk-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v6
        with:
          name: android-apk-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v6
        with:
          name: android-apk-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk

  build-web:
    name: Build Web App
    needs: [test, analyze]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Strip sample files for production build
        run: rm -rf resources/samples/

      - name: Build Web (Release)
        run: bash scripts/build.sh web

      - name: Upload Web Build
        uses: actions/upload-artifact@v6
        with:
          name: web-build
          path: build/web/

  build-ios:
    name: Build iOS App
    needs: [test, analyze]
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Strip sample files for production build
        run: rm -rf resources/samples/

      - name: Build iOS (No-Codesign)
        run: bash scripts/build.sh ios

      - name: Upload iOS App Bundle
        uses: actions/upload-artifact@v6
        with:
          name: ios-app-bundle
          path: build/ios/iphoneos/Runner.app
