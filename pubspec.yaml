name: spectral
description: "Real-time spectral visualization and SDR receiver for audio and RF signals."
publish_to: 'none'

# Synced from the root VERSION file by scripts/sync_version.sh.
version: 1.1.0+2

environment:
  sdk: ^3.2.0

dependencies:
  flutter:
    sdk: flutter
  record: ^6.2.0
  fftea: ^1.5.0
  shared_preferences: ^2.5.4
  mp_audio_stream: ^0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "resources/icon.png"
  adaptive_icon_background: "resources/icon_background.png"
  adaptive_icon_foreground: "resources/icon_foreground.png"
  adaptive_icon_monochrome: "resources/icon_monochrome.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: "resources/icon.png"
    background_color: "#05080F"
    theme_color: "#05080F"
  windows:
    generate: true
    image_path: "resources/icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "resources/icon.png"

flutter:
  uses-material-design: true

  # resources/samples/ is deliberately NOT bundled (it would bloat production
  # builds); scripts/package_distribution.sh adds it temporarily for the
  # screenshot capture build.
  assets:
    - resources/locales/
